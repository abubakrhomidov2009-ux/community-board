<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Community Board · Messages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif;background:#ECF1EE}
*{box-sizing:border-box}
a{color:#0F766E}
button,input{font-family:inherit}
</style>
</helmet>
<div style="min-height: 100%; background: #ECF1EE; color: #0E1A17; font-family: 'Onest', system-ui, sans-serif;">
<dc-import name="NavPill" hint-size="100%,92px"></dc-import>
<main style="max-width: 1280px; margin: 0 auto; padding: 24px; display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch;">
<section aria-label="Conversations" style="flex: 1 1 300px; max-width: 360px; display: flex; flex-direction: column; gap: 10px;">
<h1 style="margin: 0 0 6px; font-family: 'Unbounded', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.8px;">Messages</h1>
<sc-for list="{{convos}}" as="c" hint-placeholder-count="4">
<a href="#" style="display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 20px; background: {{c.bg}}; color: {{c.fg}}; border: 1px solid #D9E1DD; text-decoration: none;">
<span style="width: 46px; height: 46px; flex-shrink: 0; border-radius: 23px; background: {{c.avBg}}; color: {{c.avFg}}; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{c.initials}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;"><span style="display: flex; justify-content: space-between; gap: 8px;"><b style="font-size: 15px;">{{c.name}}</b><span style="font-size: 12px; opacity: 0.8;">{{c.time}}</span></span><span style="font-size: 13px; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.last}}</span></span>
</a>
</sc-for>
</section>
<section aria-label="Chat with Firuza N." style="flex: 999 1 520px; min-width: 0; min-height: 740px; border-radius: 28px; background: #FFFFFF; border: 1px solid #D9E1DD; display: flex; flex-direction: column; overflow: hidden;">
<header style="padding: 16px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1.5px dashed #C9D3CF;">
<span style="width: 44px; height: 44px; border-radius: 22px; background: #FEF3C7; color: #78350F; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center;">FN</span>
<span style="flex: 1; display: flex; flex-direction: column;"><a href="UserDesktop.dc.html" style="font-size: 16px; font-weight: 700; color: #0E1A17; text-decoration: none;">Firuza N.</a><span style="font-size: 13px; color: #5D6B67;">usually replies within an hour</span></span>
<a href="PostDesktop.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 999px; background: #F1F5F3; text-decoration: none; color: #0E1A17;"><span style="width: 32px; height: 32px; border-radius: 16px; background: #E6F7EC; border-top: 4px solid #22C55E;"></span><span style="font-size: 13px; font-weight: 600;">Room near campus · 800 somoni</span></a>
</header>
<div style="flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 12px; background-color: #F6F9F7; background-image: radial-gradient(rgba(14,26,23,0.07) 1px, transparent 1.3px); background-size: 18px 18px;">
<span style="align-self: center; font-size: 12px; font-weight: 700; color: #44524E; padding: 4px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #D9E1DD;">Today</span>
<sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
<div style="align-self: {{m.side}}; max-width: 68%; display: flex; flex-direction: column; gap: 4px;">
<span style="padding: 12px 16px; border-radius: {{m.radius}}; background: {{m.bg}}; color: {{m.fg}}; border: 1px solid {{m.border}}; font-size: 15px; line-height: 1.5;">{{m.text}}</span>
<span style="align-self: {{m.side}}; font-size: 11px; color: #5D6B67;">{{m.time}}</span>
</div>
</sc-for>
</div>
<form style="padding: 14px 16px; display: flex; gap: 10px; border-top: 1.5px dashed #C9D3CF;">
<label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Message</label>
<input id="msg" placeholder="Write a message" style="flex: 1; min-width: 0; height: 52px; padding: 0 20px; border: 1.5px solid #0E1A17; border-radius: 999px; font-size: 15px;">
<button type="button" aria-label="Send" style="width: 52px; height: 52px; border: 0; border-radius: 26px; background: #0F766E; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg></button>
</form>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const me = { side: 'flex-end', bg: '#0E1A17', fg: '#FFFFFF', border: '#0E1A17', radius: '20px 20px 4px 20px' }, them = { side: 'flex-start', bg: '#FFFFFF', fg: '#0E1A17', border: '#D9E1DD', radius: '20px 20px 20px 4px' };
const sel = { bg: '#0E1A17', fg: '#FFFFFF' }, norm = { bg: '#FFFFFF', fg: '#0E1A17' };
return {
convos: [
Object.assign({ initials: 'FN', name: 'Firuza N.', time: '10:42', last: 'Yes, Saturday after 12:00 works.', avBg: '#FEF3C7', avFg: '#78350F' }, sel),
Object.assign({ initials: 'DS', name: 'Dilshod S.', time: 'Yesterday', last: 'Thanks! I found it.', avBg: '#DBEAFE', avFg: '#1E40AF' }, norm),
Object.assign({ initials: 'MT', name: 'Madina T.', time: 'Mon', last: 'How many students in a group?', avBg: '#DCFCE7', avFg: '#166534' }, norm),
Object.assign({ initials: 'KR', name: 'Karim R.', time: '20 Oct', last: 'Is the price final?', avBg: '#E2E8F0', avFg: '#334155' }, norm)
],
msgs: [
Object.assign({ text: 'Hello! Is the room still free?', time: '10:30' }, me),
Object.assign({ text: 'Hi! Yes, it’s free from 1 November.', time: '10:35' }, them),
Object.assign({ text: 'Can I come to see it on Saturday?', time: '10:38' }, me),
Object.assign({ text: 'Yes, Saturday after 12:00 works.', time: '10:42' }, them)
]
};
}
}
</script>
</body>
</html>
