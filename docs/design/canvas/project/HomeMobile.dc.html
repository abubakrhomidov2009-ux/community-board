<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Community Board · The board on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif}
*{box-sizing:border-box}
a{color:#0F766E}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background-color: #ECF1EE; background-image: radial-gradient(rgba(14,26,23,0.10) 1px, transparent 1.3px); background-size: 18px 18px; color: #0E1A17; font-family: 'Onest', system-ui, sans-serif; display: flex; flex-direction: column;">
<dc-import name="TopBar" hint-size="390px,64px"></dc-import>
<div style="padding: 4px 16px 0; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; justify-content: space-between; align-items: flex-end;">
<h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -1px;">The board</h1>
<span style="font-size: 13px; font-weight: 600; color: #44524E;">Tue, 28 Oct</span>
</div>
<div style="position: relative;">
<label for="mq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search the board</label>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#44524E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 18px; top: 16px;"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input id="mq" type="search" placeholder="Search the board" style="width: 100%; height: 50px; padding: 0 16px 0 46px; border: 1.5px solid #0E1A17; border-radius: 999px; background: #FFFFFF; font-size: 16px; color: #0E1A17;">
</div>
<div role="tablist" aria-label="Category" style="display: flex; gap: 8px; overflow: hidden; white-space: nowrap;">
<button role="tab" aria-selected="true" style="height: 40px; padding: 0 14px; flex-shrink: 0; border-radius: 999px; border: 1.5px solid #0E1A17; background: #0E1A17; color: #FFFFFF; font-size: 14px; font-weight: 700;">All 86</button>
<button role="tab" aria-selected="false" style="height: 40px; padding: 0 14px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; border-radius: 999px; border: 1.5px solid #C9D3CF; background: #FFFFFF; color: #0E1A17; font-size: 14px; font-weight: 600;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #F97316;"></span>Lost 18</button>
<button role="tab" aria-selected="false" style="height: 40px; padding: 0 14px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; border-radius: 999px; border: 1.5px solid #C9D3CF; background: #FFFFFF; color: #0E1A17; font-size: 14px; font-weight: 600;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #3B82F6;"></span>Tutoring 24</button>
<button role="tab" aria-selected="false" style="height: 40px; padding: 0 14px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; border-radius: 999px; border: 1.5px solid #C9D3CF; background: #FFFFFF; color: #0E1A17; font-size: 14px; font-weight: 600;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #22C55E;"></span>Rentals 31</button>
</div>
<div style="display: flex; gap: 8px;">
<a href="FiltersMobile.dc.html" style="height: 40px; padding: 0 14px; display: flex; align-items: center; gap: 6px; border-radius: 999px; border: 1.5px solid #0E1A17; background: #FFFFFF; color: #0E1A17; font-size: 14px; font-weight: 700; text-decoration: none;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>Filters · 2</a>
<button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #C9D3CF; background: #FFFFFF; color: #0E1A17; font-size: 14px; font-weight: 600;">Newest</button>
</div>
</div>
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 26px 18px 0; display: flex; flex-direction: column; gap: 30px;">
<sc-for list="{{slips}}" as="s" hint-placeholder-count="2">
<dc-import name="Slip" item="{{s}}" phone="{{yes}}" hint-size="100%,300px"></dc-import>
</sc-for>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0;"><dc-import name="TabBar" active="home" hint-size="390px,100px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true,
slips: [
{ kind: 'lost', cat: 'Lost and found', time: '2 h ago', title: 'Black leather wallet near the central library', price: 'Reward offered', district: 'University campus', tilt: '-0.6deg' },
{ kind: 'rent', cat: 'Rentals', time: 'Yesterday', title: 'Room for a student, 10 minutes from campus', price: '800 somoni / month', district: 'University campus', photo: true, saved: true, tilt: '0.5deg' }
]
};
}
}
</script>
</body>
</html>
