<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in and sign up slip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="as-title" style="position: relative; width: 100%; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D9E1DD; border-radius: 8px 8px 22px 22px; font-family: 'Onest', system-ui, sans-serif; color: #0E1A17;">
<span aria-hidden="true" style="position: absolute; top: -11px; left: 50%; margin-left: -11px; width: 22px; height: 22px; border-radius: 11px; background: #F59E0B; border: 4px solid #FFFFFF; box-shadow: 0 0 0 1px #D9E1DD; box-sizing: border-box;"></span>
<div style="height: 8px; background: #0F766E; border-radius: 7px 7px 0 0;"></div>
<div style="padding: 22px 26px 24px; display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<h2 id="as-title" style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.15;">{{heading}}</h2>
<p style="margin: 0; font-size: 15px; color: #44524E;">{{sub}}</p>
</div>
<a href="{{closeHref}}" aria-label="Close" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #F1F5F3; display: flex; align-items: center; justify-content: center; color: #0E1A17;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
</div>
<sc-if value="{{isRegister}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="as-u" style="font-size: 13px; font-weight: 700;">Username</label><input id="as-u" placeholder="aziz_h" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #C9D3CF; border-radius: 14px; font-size: 16px; font-family: inherit;"></div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="as-e" style="font-size: 13px; font-weight: 700;">{{idLabel}}</label><input id="as-e" placeholder="aziz@example.com" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #0E1A17; border-radius: 14px; font-size: 16px; font-family: inherit;"></div>
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="as-p" style="font-size: 13px; font-weight: 700;">Password</label><input id="as-p" type="password" value="secretpass" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #C9D3CF; border-radius: 14px; font-size: 16px; font-family: inherit;"><sc-if value="{{isRegister}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; color: #5D6B67;">At least 8 characters.</span></sc-if></div>
<sc-if value="{{isRegister}}" hint-placeholder-val="{{false}}">
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #2B3835;"><input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #0F766E;"> I agree to the posting rules</label>
</sc-if>
<a href="{{afterHref}}" style="height: 54px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 999px; background: #0E1A17; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none;">{{submit}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
<a href="{{switchHref}}" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 56px; border-top: 1.5px dashed #C9D3CF; color: #0E1A17; font-size: 14px; font-weight: 600; text-decoration: none;">{{switchText}} <span style="color: #0F766E; font-weight: 700;">{{switchCta}}</span></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["login","register"],"default":"login"},"phone":{"editor":"boolean","default":false},"$preview":{"width":460,"height":700}}'>
class Component extends DCLogic {
renderVals() {
const reg = (this.props.mode ?? 'login') === 'register';
const phone = this.props.phone ?? false;
const loginHref = phone ? 'LoginMobile.dc.html' : 'LoginDesktop.dc.html';
return {
isRegister: reg,
heading: reg ? 'Join the board' : 'Welcome back',
sub: reg ? 'Free, and it takes a minute.' : 'Log in to see what’s pinned near you.',
idLabel: reg ? 'Email' : 'Email or username',
submit: reg ? 'Create account' : 'Log in',
switchText: reg ? 'Already on the board?' : 'New here?',
switchCta: reg ? 'Log in' : 'Create an account',
switchHref: loginHref,
closeHref: phone ? 'AboutMobile.dc.html' : 'AboutDesktop.dc.html',
afterHref: phone ? 'HomeMobile.dc.html' : 'Main.dc.html'
};
}
}
</script>
</body>
</html>
