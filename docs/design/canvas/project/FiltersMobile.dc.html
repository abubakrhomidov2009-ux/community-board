<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Community Board · Filters on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif}
*{box-sizing:border-box}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Onest', system-ui, sans-serif; color: #0E1A17;">
<dc-import name="HomeMobile" hint-size="390px,844px"></dc-import>
<div style="position: absolute; inset: 0; background: rgba(14, 26, 23, 0.6);"></div>
<section role="dialog" aria-label="Filters" style="position: absolute; left: 10px; right: 10px; bottom: 16px; background: #FFFFFF; border: 1px solid #D9E1DD; border-radius: 8px 8px 24px 24px;">
<span aria-hidden="true" style="position: absolute; top: -10px; left: 50%; margin-left: -10px; width: 20px; height: 20px; border-radius: 10px; background: #F59E0B; border: 4px solid #FFFFFF; box-shadow: 0 0 0 1px #D9E1DD; box-sizing: border-box;"></span>
<div style="height: 7px; background: #0E1A17; border-radius: 7px 7px 0 0;"></div>
<div style="padding: 18px 18px 18px; display: flex; flex-direction: column; gap: 18px;">
<h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.5px;">Filter the board</h2>
<fieldset style="border: 0; margin: 0; padding: 0;"><legend style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #44524E; margin-bottom: 10px;">What</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px;">
<button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #C9D3CF; background: #FFFFFF; color: #0E1A17; font-size: 14px; font-weight: 600;">Lost and found</button>
<button aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #0E1A17; background: #0E1A17; color: #FFFFFF; font-size: 14px; font-weight: 700;">Tutoring</button>
<button aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #0E1A17; background: #0E1A17; color: #FFFFFF; font-size: 14px; font-weight: 700;">Rentals</button>
<button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #C9D3CF; background: #FFFFFF; color: #0E1A17; font-size: 14px; font-weight: 600;">Other</button>
</div></fieldset>
<fieldset style="border: 0; margin: 0; padding: 0;"><legend style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #44524E; margin-bottom: 10px;">Where</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px;">
<button aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #0F766E; background: #E6F4F1; color: #0B4F4A; font-size: 14px; font-weight: 700;">University campus</button>
<button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #C9D3CF; background: #FFFFFF; color: #0E1A17; font-size: 14px; font-weight: 600;">Sino</button>
<button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #C9D3CF; background: #FFFFFF; color: #0E1A17; font-size: 14px; font-weight: 600;">Firdavsi</button>
<button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #C9D3CF; background: #FFFFFF; color: #0E1A17; font-size: 14px; font-weight: 600;">Shohmansur</button>
</div></fieldset>
<fieldset style="border: 0; margin: 0; padding: 0;"><legend style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #44524E; margin-bottom: 10px;">Price, somoni</legend>
<div style="display: flex; gap: 8px; align-items: center;">
<label for="fmin" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Minimum</label><input id="fmin" inputmode="numeric" placeholder="Min" style="flex: 1; min-width: 0; height: 48px; padding: 0 16px; border: 1.5px solid #C9D3CF; border-radius: 14px; font-size: 16px;">
<span style="color: #44524E;">–</span>
<label for="fmax" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Maximum</label><input id="fmax" inputmode="numeric" value="1000" style="flex: 1; min-width: 0; height: 48px; padding: 0 16px; border: 1.5px solid #0E1A17; border-radius: 14px; font-size: 16px;">
</div></fieldset>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1.5px dashed #C9D3CF;">
<button style="height: 58px; border: 0; border-right: 1.5px dashed #C9D3CF; background: transparent; color: #0E1A17; font-size: 15px; font-weight: 700;">Reset</button>
<a href="HomeMobile.dc.html" style="height: 58px; display: flex; align-items: center; justify-content: center; color: #0F766E; font-size: 15px; font-weight: 700; text-decoration: none;">Show 24 slips</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
