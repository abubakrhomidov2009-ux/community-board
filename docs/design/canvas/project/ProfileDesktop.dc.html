<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Community Board · My profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif;background:#ECF1EE}
*{box-sizing:border-box}
a{color:#0F766E}
button{font-family:inherit}
</style>
</helmet>
<div style="min-height: 100%; background-color: #ECF1EE; background-image: radial-gradient(rgba(14,26,23,0.10) 1px, transparent 1.3px); background-size: 18px 18px; color: #0E1A17; font-family: 'Onest', system-ui, sans-serif;">
<dc-import name="NavPill" hint-size="100%,92px"></dc-import>
<main style="max-width: 1280px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 28px;">
<section style="border-radius: 28px; background: #0E1A17; color: #FFFFFF; padding: 30px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px;">
<span style="width: 96px; height: 96px; border-radius: 48px; background: #FEF3C7; color: #78350F; font-family: 'Unbounded', sans-serif; font-size: 32px; font-weight: 700; display: flex; align-items: center; justify-content: center;">AH</span>
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;"><h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.8px;">Aziz Hamidov</h1><span style="transform: rotate(-4deg); border: 2px solid #5EEAD4; color: #5EEAD4; border-radius: 6px; padding: 2px 8px; font-family: 'Unbounded', sans-serif; font-size: 11px; font-weight: 700;">STUDENT ✓</span></div>
<p style="margin: 0; font-size: 15px; color: #A7B8B3;">@aziz_h · on the board since September 2026</p>
<p style="margin: 4px 0 0; display: flex; gap: 20px; font-size: 15px;"><span><b style="font-size: 20px;">3</b> active</span><span><b style="font-size: 20px;">1</b> resolved</span><span><b style="font-size: 20px;">1</b> expired</span></p>
</div>
<div style="display: flex; gap: 10px;">
<a href="UserDesktop.dc.html" style="height: 48px; padding: 0 20px; display: flex; align-items: center; border-radius: 999px; border: 1.5px solid #FFFFFF; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none;">Public profile</a>
<a href="SettingsDesktop.dc.html" style="height: 48px; padding: 0 20px; display: flex; align-items: center; border-radius: 999px; background: #FFFFFF; color: #0E1A17; font-size: 14px; font-weight: 700; text-decoration: none;">Settings</a>
</div>
</section>
<div role="tablist" aria-label="My slips" style="display: flex; gap: 6px; padding: 5px; border-radius: 999px; background: #FFFFFF; border: 1px solid #D9E1DD; align-self: flex-start;">
<button role="tab" aria-selected="true" style="height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: #0E1A17; color: #FFFFFF; font-size: 14px; font-weight: 700;">Active · 3</button>
<button role="tab" aria-selected="false" style="height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: transparent; color: #2B3835; font-size: 14px; font-weight: 600;">Resolved · 1</button>
<button role="tab" aria-selected="false" style="height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: transparent; color: #2B3835; font-size: 14px; font-weight: 600;">Expired · 1</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); column-gap: 28px; row-gap: 40px; padding-top: 8px;">
<sc-for list="{{slips}}" as="s" hint-placeholder-count="4">
<dc-import name="Slip" item="{{s}}" hint-size="100%,300px"></dc-import>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
renderVals() {
return {
slips: [
{ kind: 'tutor', cat: 'Tutoring', time: 'Today', title: 'Math lessons for first-year students', price: '45 somoni / hour', district: 'University campus', tilt: '-0.5deg' },
{ kind: 'other', cat: 'Other', time: '2 days ago', title: 'Chess club, Fridays at 17:00', price: 'Free', district: 'Sino', tilt: '0.4deg' },
{ kind: 'rent', cat: 'Rentals', time: '5 days ago', title: 'Looking for a roommate near campus', price: '600 somoni / month', district: 'Firdavsi', tilt: '-0.3deg' },
{ kind: 'lost', cat: 'Lost and found', time: '28 days ago', title: 'Lost: blue umbrella in building 3', price: 'Lost item', district: 'University campus', status: 'Expired', tilt: '0.6deg' }
]
};
}
}
</script>
</body>
</html>
