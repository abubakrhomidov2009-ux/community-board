<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Community Board · Admin slips</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif;background:#ECF1EE}
*{box-sizing:border-box}
a{color:#0F766E}
button,input,select{font-family:inherit}
</style>
</helmet>
<div style="min-height: 100%; background: #ECF1EE; color: #0E1A17; font-family: 'Onest', system-ui, sans-serif; display: flex; flex-wrap: wrap; align-items: stretch;">
<div style="flex: 1 1 220px; max-width: 260px;"><dc-import name="AdminRail" active="posts" hint-size="100%,960px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; padding: 32px 32px 48px 16px; display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; flex-direction: column; gap: 6px;"><p style="margin: 0; font-size: 14px; font-weight: 600; color: #44524E;">Every slip on the board</p><h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: 40px; font-weight: 700; letter-spacing: -1.2px;">Slips</h1></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px;">
<label for="ap-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search slips</label>
<input id="ap-q" type="search" placeholder="Search by title, author, or ID" style="flex: 1 1 280px; min-width: 0; height: 48px; padding: 0 20px; border: 1.5px solid #0E1A17; border-radius: 999px; font-size: 15px; background: #FFFFFF;">
<label for="ap-s" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Status</label>
<select id="ap-s" style="height: 48px; padding: 0 16px; border: 1.5px solid #C9D3CF; border-radius: 999px; font-size: 14px; font-weight: 600; background: #FFFFFF;"><option>All statuses</option><option>Active</option><option>Resolved</option><option>Expired</option><option>Removed</option></select>
</div>
<section style="background: #FFFFFF; border: 1px solid #D9E1DD; border-radius: 24px; overflow-x: auto;">
<div style="min-width: 760px;">
<div style="display: grid; grid-template-columns: 2.4fr 1.1fr 0.9fr 0.8fr 1fr; gap: 12px; padding: 14px 22px; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #44524E; border-bottom: 1.5px dashed #C9D3CF;"><span>Slip</span><span>Author</span><span>Status</span><span>Pinned ↓</span><span style="text-align: right;">Actions</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 2.4fr 1.1fr 0.9fr 0.8fr 1fr; gap: 12px; align-items: center; padding: 14px 22px; border-bottom: 1.5px dashed #E1E8E4;">
<span style="display: flex; align-items: center; gap: 10px; min-width: 0;"><span style="width: 8px; height: 36px; border-radius: 4px; background: {{r.strip}}; flex-shrink: 0;"></span><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;"><a href="AdminPostDetailDesktop.dc.html" style="font-size: 15px; font-weight: 700; color: #0E1A17; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.title}}</a><span style="font-size: 12px; color: #5D6B67;">{{r.id}} · {{r.cat}}</span></span></span>
<a href="AdminUserDetailDesktop.dc.html" style="font-size: 14px; font-weight: 700; text-decoration: none;">{{r.author}}</a>
<span style="justify-self: start; border: 2px solid {{r.sColor}}; color: {{r.sColor}}; border-radius: 5px; padding: 1px 7px; font-family: 'Unbounded', sans-serif; font-size: 10px; font-weight: 700; transform: rotate(-3deg);">{{r.status}}</span>
<span style="font-size: 14px; color: #44524E;">{{r.date}}</span>
<span style="display: flex; justify-content: flex-end; gap: 8px;"><a href="AdminPostDetailDesktop.dc.html" style="height: 38px; padding: 0 14px; display: flex; align-items: center; border: 1.5px solid #0E1A17; border-radius: 999px; color: #0E1A17; font-size: 13px; font-weight: 700; text-decoration: none;">View</a><button style="height: 38px; padding: 0 14px; border: 1.5px solid #B91C1C; border-radius: 999px; background: #FFFFFF; color: #B91C1C; font-size: 13px; font-weight: 700;">{{r.action}}</button></span>
</div>
</sc-for>
</div>
</section>
<p style="margin: 0; font-size: 14px; color: #44524E;">Showing 1–5 of 92 slips</p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
const st = { ACTIVE: '#0F766E', RESOLVED: '#1D4ED8', EXPIRED: '#64748B', REMOVED: '#B91C1C' };
const rows = [
{ title: 'Room for a student, 10 minutes from campus', id: '#1048', cat: 'Rentals', strip: '#22C55E', author: '@firuza_n', status: 'ACTIVE', date: '27 Oct', action: 'Take down' },
{ title: 'iPhone 15 for 500 somoni, today only', id: '#1042', cat: 'Other · 3 reports', strip: '#94A3B8', author: '@user_8812', status: 'ACTIVE', date: '28 Oct', action: 'Take down' },
{ title: 'Found: student ID card near bus stop 12', id: '#1037', cat: 'Lost and found', strip: '#F97316', author: '@dilshod_s', status: 'RESOLVED', date: '26 Oct', action: 'Take down' },
{ title: 'Lost: blue umbrella in building 3', id: '#0991', cat: 'Lost and found', strip: '#F97316', author: '@aziz_h', status: 'EXPIRED', date: '30 Sep', action: 'Take down' },
{ title: 'Selling old textbooks', id: '#1021', cat: 'Other', strip: '#94A3B8', author: '@madina_t', status: 'REMOVED', date: '24 Oct', action: 'Restore' }
];
return { rows: rows.map((r) => Object.assign({}, r, { sColor: st[r.status] })) };
}
}
</script>
</body>
</html>
