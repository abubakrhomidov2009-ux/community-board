<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Community Board · Admin user detail on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif}
*{box-sizing:border-box}
a{color:#0F766E}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #ECF1EE; color: #0E1A17; font-family: 'Onest', system-ui, sans-serif; display: flex; flex-direction: column;">
<dc-import name="AdminBar" active="users" hint-size="390px,120px"></dc-import>
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 14px; display: flex; flex-direction: column; gap: 12px;">
<a href="AdminUsersMobile.dc.html" style="font-size: 14px; font-weight: 700; text-decoration: none;">← All users</a>
<section style="background: #FFFFFF; border: 1px solid #D9E1DD; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; gap: 12px;"><span style="width: 56px; height: 56px; border-radius: 28px; background: #F1F5F3; font-family: 'Unbounded', sans-serif; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center;">U8</span><span style="display: flex; flex-direction: column; gap: 4px;"><b style="font-family: 'Unbounded', sans-serif; font-size: 17px;">@user_8812</b><span style="display: flex; gap: 6px; align-items: center;"><span style="border: 2px solid #0F766E; color: #0F766E; border-radius: 4px; padding: 0 5px; font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 700;">ACTIVE</span><span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #F1F5F3;">User</span></span></span></div>
<p style="margin: 0; font-size: 13px; color: #44524E;">User #577 · user8812@example.com · joined 20 Oct</p>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center;">
<span style="padding: 10px 4px; border-radius: 14px; background: #F1F5F3; display: flex; flex-direction: column;"><b style="font-family: 'Unbounded', sans-serif; font-size: 18px;">7</b><span style="font-size: 11px; color: #44524E;">slips</span></span>
<span style="padding: 10px 4px; border-radius: 14px; background: #0E1A17; display: flex; flex-direction: column;"><b style="font-family: 'Unbounded', sans-serif; font-size: 18px; color: #FCA5A5;">5</b><span style="font-size: 11px; color: #FCA5A5;">reports</span></span>
<span style="padding: 10px 4px; border-radius: 14px; background: #F1F5F3; display: flex; flex-direction: column;"><b style="font-family: 'Unbounded', sans-serif; font-size: 18px;">3</b><span style="font-size: 11px; color: #44524E;">notes</span></span>
</div>
</section>
<sc-for list="{{posts}}" as="p" hint-placeholder-count="3">
<a href="AdminPostDetailMobile.dc.html" style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #D9E1DD; text-decoration: none; color: #0E1A17;"><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;"><b style="font-size: 14px;">{{p.title}}</b><span style="font-size: 12px; color: #5D6B67;">{{p.meta}}</span></span><span style="border: 2px solid {{p.color}}; color: {{p.color}}; border-radius: 4px; padding: 0 5px; font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 700;">{{p.reports}}</span></a>
</sc-for>
</div>
<div style="flex-shrink: 0; margin: 0 12px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #FFFFFF; border: 1px solid #D9E1DD; border-radius: 22px; overflow: hidden;">
<button title="Only the super admin sees this button" style="height: 56px; border: 0; border-right: 1.5px dashed #C9D3CF; background: transparent; color: #0E1A17; font-size: 14px; font-weight: 700;">Make admin</button>
<button style="height: 56px; border: 0; background: #B91C1C; color: #FFFFFF; font-size: 14px; font-weight: 700;">Block user</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
posts: [
{ title: 'iPhone 15 for 500 somoni', meta: '#1042 · Active', reports: '3 REPORTS', color: '#B91C1C' },
{ title: 'Samsung S24, cheap, today only', meta: '#1038 · Active', reports: '2 REPORTS', color: '#B91C1C' },
{ title: 'AirPods Pro, new in box', meta: '#1031 · Active', reports: 'CLEAN', color: '#64748B' }
]
};
}
}
</script>
</body>
</html>
