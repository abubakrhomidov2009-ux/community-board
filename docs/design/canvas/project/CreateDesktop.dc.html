<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Community Board · Pin or edit a post</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif;background:#ECF1EE}
*{box-sizing:border-box}
a{color:#0F766E}a:hover{color:#0B4F4A}
button,input,select,textarea{font-family:inherit}
</style>
</helmet>
<div style="min-height: 100%; background-color: #ECF1EE; background-image: radial-gradient(rgba(14,26,23,0.10) 1px, transparent 1.3px); background-size: 18px 18px; color: #0E1A17; font-family: 'Onest', system-ui, sans-serif;">
<dc-import name="NavPill" hint-size="100%,92px"></dc-import>
<main style="max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 24px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<a href="{{backHref}}" style="font-size: 14px; font-weight: 600; text-decoration: none;">{{backLabel}}</a>
<h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: 40px; font-weight: 700; letter-spacing: -1.2px;">{{heading}}</h1>
</div>
<sc-if value="{{edit}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 18px; border-radius: 999px; background: #FFF8E6; border: 1px solid #EBDDB5; font-size: 14px; color: #5B4210;">Comes down in 3 days<button type="button" style="height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: #0E1A17; color: #FFFFFF; font-size: 14px; font-weight: 700;">Renew 30 days</button></div>
</sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start;">
<form style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #D9E1DD; border-radius: 28px; padding: 30px; display: flex; flex-direction: column; gap: 24px;">
<fieldset style="border: 0; margin: 0; padding: 0;"><legend style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #44524E; margin-bottom: 12px;">1 · What is it?</legend>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;">
<label style="height: 88px; display: flex; flex-direction: column; justify-content: space-between; padding: 12px 14px; border: 1.5px solid #C9D3CF; border-radius: 16px; font-size: 14px; font-weight: 600;"><span style="width: 100%; height: 6px; border-radius: 3px; background: #F97316;"></span><span style="display: flex; align-items: center; gap: 8px;"><input type="radio" name="cat" style="accent-color: #0F766E;"> Lost and found</span></label>
<label style="height: 88px; display: flex; flex-direction: column; justify-content: space-between; padding: 12px 14px; border: 1.5px solid #C9D3CF; border-radius: 16px; font-size: 14px; font-weight: 600;"><span style="width: 100%; height: 6px; border-radius: 3px; background: #3B82F6;"></span><span style="display: flex; align-items: center; gap: 8px;"><input type="radio" name="cat" style="accent-color: #0F766E;"> Tutoring</span></label>
<label style="height: 88px; display: flex; flex-direction: column; justify-content: space-between; padding: 12px 14px; border: 2px solid #0E1A17; border-radius: 16px; background: #F1F5F3; font-size: 14px; font-weight: 700;"><span style="width: 100%; height: 6px; border-radius: 3px; background: #22C55E;"></span><span style="display: flex; align-items: center; gap: 8px;"><input type="radio" name="cat" checked style="accent-color: #0F766E;"> Rentals</span></label>
<label style="height: 88px; display: flex; flex-direction: column; justify-content: space-between; padding: 12px 14px; border: 1.5px solid #C9D3CF; border-radius: 16px; font-size: 14px; font-weight: 600;"><span style="width: 100%; height: 6px; border-radius: 3px; background: #94A3B8;"></span><span style="display: flex; align-items: center; gap: 8px;"><input type="radio" name="cat" style="accent-color: #0F766E;"> Other</span></label>
</div></fieldset>
<div style="display: flex; flex-direction: column; gap: 8px;"><label for="c-t" style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #44524E;">2 · Title</label><input id="c-t" value="{{v.title}}" placeholder="Room for a student near campus" style="height: 54px; padding: 0 18px; border: 1.5px solid #0E1A17; border-radius: 16px; font-size: 17px;"></div>
<div style="display: flex; flex-direction: column; gap: 8px;"><label for="c-d" style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #44524E;">3 · Details</label><textarea id="c-d" rows="4" placeholder="What, where, and when" style="padding: 14px 18px; border: 1.5px solid #C9D3CF; border-radius: 16px; font-size: 16px; resize: vertical;">{{v.desc}}</textarea></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 8px;"><label for="c-p" style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #44524E;">Price, somoni</label><input id="c-p" inputmode="numeric" value="{{v.price}}" placeholder="800" style="height: 52px; padding: 0 16px; border: 1.5px solid #C9D3CF; border-radius: 16px; font-size: 16px; min-width: 0;"></div>
<div style="display: flex; flex-direction: column; gap: 8px;"><label for="c-u" style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #44524E;">Per</label><select id="c-u" style="height: 52px; padding: 0 14px; border: 1.5px solid #C9D3CF; border-radius: 16px; font-size: 16px; background: #FFFFFF;"><option>Month</option><option>Hour</option><option>One time</option></select></div>
<div style="display: flex; flex-direction: column; gap: 8px;"><label for="c-w" style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #44524E;">Where</label><select id="c-w" style="height: 52px; padding: 0 14px; border: 1.5px solid #C9D3CF; border-radius: 16px; font-size: 16px; background: #FFFFFF;"><option>University campus</option><option>Sino</option><option>Firdavsi</option><option>Shohmansur</option><option>Ismoili Somoni</option><option>Other</option></select></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px;"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #44524E;">4 · Photos <span style="text-transform: none; letter-spacing: 0; font-weight: 500;">up to 5, max 5 MB</span></span>
<div style="display: flex; flex-wrap: wrap; gap: 10px;">
<button type="button" style="width: 112px; height: 112px; border: 2px dashed #0E1A17; border-radius: 18px; background: #F1F5F3; color: #0E1A17; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 700;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Add photo</button>
<span aria-label="Photo 1" style="width: 112px; height: 112px; border-radius: 18px; background: #D8F0E1; transform: rotate(-2deg);"></span>
<span aria-label="Photo 2" style="width: 112px; height: 112px; border-radius: 18px; background: #CBE9D6; transform: rotate(2deg);"></span>
</div></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 8px;"><label for="c-tg" style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #44524E;">5 · Telegram</label><input id="c-tg" value="{{v.tg}}" placeholder="@username" style="height: 52px; padding: 0 16px; border: 1.5px solid #C9D3CF; border-radius: 16px; font-size: 16px; min-width: 0;"></div>
<div style="display: flex; flex-direction: column; gap: 8px;"><label for="c-ph" style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #44524E;">Phone <span style="text-transform: none; letter-spacing: 0; font-weight: 500;">optional</span></label><input id="c-ph" type="tel" placeholder="+992" style="height: 52px; padding: 0 16px; border: 1.5px solid #C9D3CF; border-radius: 16px; font-size: 16px; min-width: 0;"></div>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding-top: 18px; border-top: 1.5px dashed #C9D3CF;">
<sc-if value="{{edit}}" hint-placeholder-val="{{false}}"><div style="display: flex; gap: 10px;"><button type="button" style="height: 52px; padding: 0 20px; border: 1.5px solid #B91C1C; border-radius: 999px; background: #FFFFFF; color: #B91C1C; font-size: 15px; font-weight: 700;">Take it down</button><button type="button" style="height: 52px; padding: 0 20px; border: 1.5px solid #0F766E; border-radius: 999px; background: #FFFFFF; color: #0F766E; font-size: 15px; font-weight: 700;">Stamp resolved</button></div></sc-if>
<sc-if value="{{create}}" hint-placeholder-val="{{true}}"><a href="Main.dc.html" style="height: 52px; padding: 0 22px; display: flex; align-items: center; border: 1.5px solid #C9D3CF; border-radius: 999px; color: #0E1A17; font-size: 15px; font-weight: 700; text-decoration: none;">Cancel</a></sc-if>
<a href="PostDesktop.dc.html" style="height: 52px; padding: 0 26px; display: flex; align-items: center; gap: 10px; border-radius: 999px; background: #0F766E; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none;">{{submit}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
</form>
<aside style="flex: 1 1 300px; max-width: 360px; display: flex; flex-direction: column; gap: 14px;">
<p style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #44524E;">Live preview</p>
<div style="padding: 14px 6px;"><dc-import name="Slip" item="{{preview}}" hint-size="100%,440px"></dc-import></div>
<p style="margin: 0; font-size: 14px; line-height: 1.6; color: #2B3835;">Clear title, real photos, the price, and the district get the most replies.</p>
</aside>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"edit":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1150}}'>
class Component extends DCLogic {
renderVals() {
const edit = this.props.edit ?? false;
return {
edit, create: !edit,
heading: edit ? 'Edit your slip' : 'Pin a new slip',
submit: edit ? 'Save changes' : 'Pin it to the board',
backHref: edit ? 'PostDesktop.dc.html' : 'Main.dc.html',
backLabel: edit ? '← Back to the slip' : '← Back to the board',
v: edit ? { title: 'Room for a student, 10 minutes from campus', desc: 'A bright room in a 3-room flat, 10 minutes from campus. Furnished, Wi-Fi included.', price: '800', tg: '@firuza_n' } : { title: '', desc: '', price: '', tg: '' },
preview: { kind: 'rent', cat: 'Rentals', time: 'Just now', title: edit ? 'Room for a student, 10 minutes from campus' : 'Your title shows here', price: edit ? '800 somoni / month' : '[price] somoni / month', district: 'University campus', photo: true, tilt: '1deg' }
};
}
}
</script>
</body>
</html>
