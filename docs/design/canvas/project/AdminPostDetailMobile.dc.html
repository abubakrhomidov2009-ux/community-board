<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Community Board · Admin slip detail on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif}
*{box-sizing:border-box}
a{color:#0F766E}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #ECF1EE; color: #0E1A17; font-family: 'Onest', system-ui, sans-serif; display: flex; flex-direction: column;">
<dc-import name="AdminBar" active="posts" hint-size="390px,120px"></dc-import>
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 14px; display: flex; flex-direction: column; gap: 12px;">
<a href="AdminPostsMobile.dc.html" style="font-size: 14px; font-weight: 700; text-decoration: none;">← All slips</a>
<section style="background: #FFFFFF; border: 1px solid #D9E1DD; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 8px; border-top: 7px solid #94A3B8;">
<div style="display: flex; gap: 8px; align-items: center;"><span style="border: 2px solid #0F766E; color: #0F766E; border-radius: 4px; padding: 0 6px; font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 700;">ACTIVE</span><span style="border: 2px solid #B91C1C; color: #B91C1C; border-radius: 4px; padding: 0 6px; font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 700;">3 REPORTS</span><span style="font-size: 12px; font-weight: 700; color: #44524E;">#1042</span></div>
<h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: 18px; font-weight: 700; line-height: 1.25;">iPhone 15 for 500 somoni, today only</h1>
<p style="margin: 0; font-size: 13px; color: #44524E;">Other · Sino · 500 somoni · pinned 28 Oct</p>
</section>
<section style="background: #FFFFFF; border: 1px solid #D9E1DD; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 2px;" aria-label="Reports">
<h2 style="margin: 0 0 6px; font-family: 'Unbounded', sans-serif; font-size: 14px; font-weight: 700;">Reports · 3</h2>
<sc-for list="{{reports}}" as="r" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 3px; padding: 9px 0; border-top: 1.5px dashed #C9D3CF;"><span style="display: flex; gap: 6px; align-items: center;"><b style="font-size: 13px;">{{r.user}}</b><span style="border: 2px solid {{r.color}}; color: {{r.color}}; border-radius: 4px; padding: 0 5px; font-family: 'Unbounded', sans-serif; font-size: 8px; font-weight: 700;">{{r.reason}}</span></span><span style="font-size: 13px; color: #2B3835;">{{r.note}}</span></div>
</sc-for>
</section>
<a href="AdminUserDetailMobile.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 22px; background: #0E1A17; color: #FFFFFF; text-decoration: none;">
<span style="width: 40px; height: 40px; border-radius: 20px; background: #2B3835; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;">U8</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><b style="font-size: 14px;">Author: @user_8812</b><span style="font-size: 12px; color: #A7B8B3;">User #577 · 7 slips · 5 reports</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A7B8B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
</a>
</div>
<div style="flex-shrink: 0; margin: 0 12px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #FFFFFF; border: 1px solid #D9E1DD; border-radius: 22px; overflow: hidden;">
<button style="height: 56px; border: 0; border-right: 1.5px dashed #C9D3CF; background: transparent; color: #0E1A17; font-size: 14px; font-weight: 700;">Dismiss reports</button>
<button style="height: 56px; border: 0; background: #B91C1C; color: #FFFFFF; font-size: 14px; font-weight: 700;">Take down</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const scam = { reason: 'SCAM', color: '#B91C1C' }, spam = { reason: 'SPAM', color: '#B45309' };
return {
reports: [
Object.assign({ user: '@dilshod_s', note: 'Asks for money first.' }, scam),
Object.assign({ user: '@madina_t', note: 'The price is too low to be real.' }, scam),
Object.assign({ user: '@karim_r', note: 'Same slip pinned three times.' }, spam)
]
};
}
}
</script>
</body>
</html>
