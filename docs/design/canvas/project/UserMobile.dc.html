<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Community Board · Public profile on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif}
*{box-sizing:border-box}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background-color: #ECF1EE; background-image: radial-gradient(rgba(14,26,23,0.10) 1px, transparent 1.3px); background-size: 18px 18px; color: #0E1A17; font-family: 'Onest', system-ui, sans-serif; display: flex; flex-direction: column;">
<dc-import name="TopBar" title="@firuza_n" back-href="PostMobile.dc.html" hint-size="390px,64px"></dc-import>
<section style="margin: 4px 14px 0; border-radius: 24px; background: #FFFFFF; border: 1px solid #D9E1DD; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;">
<span style="width: 72px; height: 72px; border-radius: 36px; background: #FEF3C7; color: #78350F; font-family: 'Unbounded', sans-serif; font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center;">FN</span>
<h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 700;">Firuza N.</h1>
<span style="transform: rotate(-3deg); border: 2px solid #1D4ED8; color: #1D4ED8; border-radius: 5px; padding: 1px 7px; font-family: 'Unbounded', sans-serif; font-size: 10px; font-weight: 700;">STUDENT ✓</span>
<p style="margin: 0; font-size: 13px; color: #44524E;">Since March 2026 · 4 active slips</p>
<a href="ChatMobile.dc.html" style="align-self: stretch; margin-top: 4px; height: 50px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; background: #0F766E; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none;">Send a message</a>
</section>
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 26px 18px 0; display: flex; flex-direction: column; gap: 30px;">
<sc-for list="{{slips}}" as="s" hint-placeholder-count="2">
<dc-import name="Slip" item="{{s}}" phone="{{yes}}" hint-size="100%,280px"></dc-import>
</sc-for>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0;"><dc-import name="TabBar" active="none" hint-size="390px,100px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true,
slips: [
{ kind: 'rent', cat: 'Rentals', time: 'Yesterday', title: 'Room for a student, 10 min from campus', price: '800 somoni / month', district: 'University campus', tilt: '-0.4deg' },
{ kind: 'tutor', cat: 'Tutoring', time: '3 days ago', title: 'Russian for beginners', price: '35 somoni / hour', district: 'Sino', tilt: '0.5deg' }
]
};
}
}
</script>
</body>
</html>
