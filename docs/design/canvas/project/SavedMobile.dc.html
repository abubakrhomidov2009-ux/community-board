<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Community Board · Saved on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif}
*{box-sizing:border-box}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background-color: #ECF1EE; background-image: radial-gradient(rgba(14,26,23,0.10) 1px, transparent 1.3px); background-size: 18px 18px; color: #0E1A17; font-family: 'Onest', system-ui, sans-serif; display: flex; flex-direction: column;">
<dc-import name="TopBar" hint-size="390px,64px"></dc-import>
<div style="padding: 4px 16px 0; display: flex; flex-direction: column; gap: 4px;">
<h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -1px;">Saved slips</h1>
<p style="margin: 0; font-size: 14px; color: #44524E;">4 slips you saved. Only you see this.</p>
</div>
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 26px 18px 0; display: flex; flex-direction: column; gap: 30px;">
<sc-for list="{{slips}}" as="s" hint-placeholder-count="2">
<dc-import name="Slip" item="{{s}}" phone="{{yes}}" hint-size="100%,280px"></dc-import>
</sc-for>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0;"><dc-import name="TabBar" active="saved" hint-size="390px,100px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true,
slips: [
{ kind: 'tutor', cat: 'Tutoring', time: '5 h ago', title: 'English for IELTS, evening groups', price: '50 somoni / hour', district: 'Firdavsi', saved: true, tilt: '-0.5deg' },
{ kind: 'rent', cat: 'Rentals', time: 'Yesterday', title: 'Room for a student, 10 min from campus', price: '800 somoni / month', district: 'University campus', saved: true, tilt: '0.4deg' }
]
};
}
}
</script>
</body>
</html>
