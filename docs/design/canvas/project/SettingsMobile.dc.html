<div style="display: flex; flex-direction: column; gap: 6px;"><label for="m-u" style="font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #44524E;">Username</label><input id="m-u" value="aziz_h" style="height: 50px; padding: 0 16px; border: 1.5px solid #C9D3CF; border-radius: 14px; font-size: 16px;"></div>
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="m-e" style="font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #44524E;">Email</label><input id="m-e" type="email" value="aziz@example.com" style="height: 50px; padding: 0 16px; border: 1.5px solid #C9D3CF; border-radius: 14px; font-size: 16px;"></div>

<button role="radio" aria-checked="false" style="height: 44px; border: 0; border-radius: 999px; background: transparent; color: #2B3835; font-size: 14px; font-weight: 600;">Light</button>
<button role="radio" aria-checked="false" style="height: 44px; border: 0; border-radius: 999px; background: transparent; color: #2B3835; font-size: 14px; font-weight: 600;">Dark</button>
<button role="radio" aria-checked="true" style="height: 44px; border: 0; border-radius: 999px; background: #0E1A17; color: #FFFFFF; font-size: 14px; font-weight: 700;">System</button>
</div>
</section>
<section style="background: #FFFFFF; border: 1px solid #D9E1DD; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px;">

<button role="radio" aria-checked="false" style="height: 44px; border: 0; border-radius: 999px; background: transparent; color: #2B3835; font-size: 14px; font-weight: 600;">Русский</button>
<button role="radio" aria-checked="true" style="height: 44px; border: 0; border-radius: 999px; background: #0E1A17; color: #FFFFFF; font-size: 14px; font-weight: 700;">English</button>
</div>
</section>
<section style="position: relative; background: #FFFFFF; border: 1px solid #D9E1DD; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px;">
<span style="position: absolute; right: 16px; top: 16px; transform: rotate(-6deg); border: 2px solid #0F766E; color: #0F766E; border-radius: 5px; padding: 2px 7px; font-family: 'Unbounded', sans-serif; font-size: 10px; font-weight: 700;">VERIFIED</span>

<input id="m-uni" type="email" value="a.hamidov@university.tj" style="height: 50px; padding: 0 16px; border: 1.5px solid #C9D3CF; border-radius: 14px; font-size: 16px;">
<button style="height: 50px; border: 1.5px solid #0E1A17; border-radius: 999px; background: #FFFFFF; color: #0E1A17; font-size: 15px; font-weight: 700;">Send link again</button>
