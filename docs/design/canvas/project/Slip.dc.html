<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notice slip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<article style="position: relative; width: 100%; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D9E1DD; border-radius: 6px 6px 18px 18px; font-family: 'Onest', system-ui, sans-serif; color: #0E1A17; transform: rotate({{tilt}});">
<span aria-hidden="true" style="position: absolute; top: -9px; left: 50%; margin-left: -9px; width: 18px; height: 18px; border-radius: 9px; background: #F59E0B; border: 3px solid #FFFFFF; box-shadow: 0 0 0 1px #D9E1DD; box-sizing: border-box;"></span>
<div style="height: 7px; background: {{k.strip}}; border-radius: 5px 5px 0 0;"></div>
<sc-if value="{{hasPhoto}}" hint-placeholder-val="{{false}}">
<div style="height: 150px; margin: 12px 12px 0; border-radius: 10px; background: {{k.tint}}; color: {{k.label}}; display: flex; align-items: center; justify-content: center;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{k.icon}}"></path></svg></div>
</sc-if>
<div style="padding: 16px 18px 16px; display: flex; flex-direction: column; gap: 9px;">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
<span style="display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: 0.9px; text-transform: uppercase; color: {{k.label}};"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{k.strip}};"></span>{{item.cat}}</span>
<span style="font-size: 12px; color: #5D6B67;">{{item.time}}</span>
</div>
<h3 style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: 16px; font-weight: 500; line-height: 1.35; letter-spacing: -0.2px;"><a href="{{postHref}}" style="color: #0E1A17; text-decoration: none;">{{item.title}}</a></h3>
<p style="margin: 0; font-size: 19px; font-weight: 700; color: #0F766E;">{{item.price}}</p>
<p style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #44524E;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>{{item.district}}</p>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1.5px dashed #C9D3CF;">
<a href="https://t.me/" aria-label="Write on Telegram" style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px; border-right: 1.5px dashed #C9D3CF; color: #0E1A17; font-size: 13px; font-weight: 600; text-decoration: none;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>Write</a>
<a href="tel:" aria-label="Call the author" style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px; border-right: 1.5px dashed #C9D3CF; color: #0E1A17; font-size: 13px; font-weight: 600; text-decoration: none;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>Call</a>
<button aria-label="{{saveLabel}}" style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: transparent; color: {{saveColor}}; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;"><svg width="15" height="15" viewBox="0 0 24 24" fill="{{saveFill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>{{saveText}}</button>
</div>
<sc-if value="{{hasStamp}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; right: 16px; top: {{stampTop}}; transform: rotate(-9deg); border: 2.5px solid {{stampColor}}; color: {{stampColor}}; background: rgba(255,255,255,0.9); font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; padding: 5px 11px; border-radius: 6px;">{{item.status}}</span>
</sc-if>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"phone":{"editor":"boolean","default":false},"$preview":{"width":320,"height":470}}'>
class Component extends DCLogic {
renderVals() {
const item = this.props.item ?? { kind: 'rent', cat: 'Rentals', time: 'Yesterday', title: 'Room for a student, 10 minutes from campus', price: '800 somoni / month', district: 'University campus', photo: true };
const kinds = {
lost: { strip: '#F97316', tint: '#FFF1E6', label: '#C2410C', icon: 'M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7ZM14 2v4a2 2 0 0 0 2 2h4M10 13H8M16 17H8M16 13h-2' },
tutor: { strip: '#3B82F6', tint: '#E8F0FE', label: '#1D4ED8', icon: 'M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20' },
rent: { strip: '#22C55E', tint: '#E6F7EC', label: '#15803D', icon: 'M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8v9' },
other: { strip: '#94A3B8', tint: '#EEF1F5', label: '#475569', icon: 'M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z' }
};
const k = kinds[item.kind] || kinds.other;
const status = item.status || '';
const stampColors = { Resolved: '#0F766E', Expired: '#64748B', Removed: '#B91C1C' };
const saved = !!item.saved;
return {
item, k,
tilt: item.tilt || '0deg',
hasPhoto: !!item.photo,
hasStamp: status !== '',
stampColor: stampColors[status] || '#0F766E',
stampTop: item.photo ? '120px' : '30px',
postHref: (this.props.phone ?? false) ? 'PostMobile.dc.html' : 'PostDesktop.dc.html',
saveFill: saved ? '#DC2626' : 'none',
saveColor: saved ? '#B91C1C' : '#0E1A17',
saveText: saved ? 'Saved' : 'Save',
saveLabel: saved ? 'Remove from saved' : 'Save post'
};
}
}
</script>
</body>
</html>
