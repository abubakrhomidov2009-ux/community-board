# Optional: local PostgreSQL 16 in Docker (the default is PostgreSQL installed on Windows).
# Start: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: community_board
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: community_board
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
