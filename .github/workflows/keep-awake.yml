name: Keep API awake

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the API health check
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          if [ -z "$API_HEALTH_URL" ]; then echo "API_HEALTH_URL is not set"; exit 0; fi
          curl --fail --silent --show-error --max-time 90 --retry 2 "$API_HEALTH_URL"
